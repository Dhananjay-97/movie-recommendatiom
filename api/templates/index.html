<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Recommender</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}" />
    <link rel="shortcut icon" href="{{ url_for('static', filename='movie-icon.png') }}" />
  </head>
  <body>
    <img src="https://cdn-icons-png.flaticon.com/512/2503/2503508.png" class="icon" alt="Movie Icon" />
    <h3>Movie GenAI Recommender</h3>
    
    <form action="/" method="post">
      <label for="category">Genre or Mood</label>
      <input type="text" name="category" placeholder="e.g. Sci-Fi, Sad, 90s Action" required />
      
      <label for="number">Number of Recommendations</label>
      <input type="number" name="number" placeholder="5" min="1" max="10" required />
      
      <input type="submit" value="Generate Recommendations" />
    </form>
    
    {% if result %}
    <div class="result-container">
        <h4>Top Picks:</h4>
        <div class="result">{{ result }}</div>
    </div>
    {% endif %}
  </body>
</html>
